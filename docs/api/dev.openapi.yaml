openapi: 3.0.3
info:
  title: 통신 고객정보 서비스 API (F1~F3)
  version: 0.1.0
  description: |
    F1 회원 가입·본인 확인, F2 내 고객정보 조회·수정, F3 관리자 회원 관리.
    엔티티·필드·상태 이름은 spec/data-model.md를 따른다.
    x-allowed-roles는 호출 가능한 역할이다. 역할·신원·계정 상태는 서버에 저장된 로그인 계정 값으로만 판단한다.
    마스킹 표시 필드는 data-model.md 2장의 형태로만 응답한다.
servers:
  - url: /api/v1
security:
  - loginSession: []
tags:
  - name: F1
    description: 회원 가입·본인 확인
  - name: F2
    description: 내 고객정보 조회·수정
  - name: F3
    description: 관리자 회원 관리
  - name: F9
    description: 상담·관리 보조 기능

paths:
  /signup:
    post:
      tags: [F1]
      summary: 회원 가입 신청
      description: |
        Customer와 Account(role=CUSTOMER, status=PENDING_VERIFICATION)를 만든다.
        role, status, 식별자, 내부 정보는 서버가 정한다. SignupRequest에 정의되지 않은 필드가 있으면 400으로 거부하고 계정을 만들지 않는다.
      security: []
      x-allowed-roles: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 가입 신청 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: login_id 중복. 기존 계정 정보를 담지 않는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /signup/identity-verifications:
    post:
      tags: [F1]
      summary: 본인 확인 요청
      description: signup_ref가 가리키는 계정이 PENDING_VERIFICATION일 때만 외부 본인 확인 기관에 확인 요청을 만든다.
      security: []
      x-allowed-roles: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signup_ref]
              properties:
                signup_ref: { type: string }
      responses:
        '201':
          description: 확인 요청 생성
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_id: { type: string }
                  redirect_url: { type: string, format: uri }
                  expires_at:
                    type: string
                    format: date-time
                    description: 요청 생성 후 운영 정책 유효 시간(기본 10분)
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 계정이 PENDING_VERIFICATION이 아님(이미 본인 확인을 마친 계정 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /signup/identity-verifications/{verification_id}/complete:
    post:
      tags: [F1]
      summary: 본인 확인 완료
      description: |
        서버가 외부 본인 확인 기관에 agency_result_ref의 결과를 직접 확인한다.
        결과가 성공이고 이 verification_id에 대해 발급되었으며 대상자(이름·생년월일)가 가입 신청 값과 같고 결과에 연계정보(ci)가 있을 때만
        계정을 ACTIVE로 바꾸고 identity_verified_at을 기록하며, ci를 암호화해 저장한다. ci는 응답에 담지 않는다. 결과 하나는 한 번만 쓴다.
      security: []
      x-allowed-roles: [ANONYMOUS]
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agency_result_ref]
              properties:
                agency_result_ref:
                  type: string
                  description: 외부 본인 확인 기관이 발급한 결과 참조값
      responses:
        '200':
          description: 본인 확인 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ACTIVE] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            확인 실패·만료·이미 사용된 결과. 계정 상태는 PENDING_VERIFICATION으로 남는다.
            이미 COMPLETED인 verification_id로 다시 요청해도 409이며, 계정 상태와 확인 요청 기록은 바뀌지 않는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [F1]
      summary: 로그인
      description: |
        ACTIVE 계정이고 비밀번호가 맞을 때만 로그인 상태를 만든다.
        실패 사유(아이디 없음, 비밀번호 불일치, 계정 상태)는 응답으로 구분하지 않는다.
        비밀번호 불일치 시 failed_login_count를 올리고, 성공 시 0으로 한다.
      security: []
      x-allowed-roles: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_id, password]
              properties:
                login_id: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 로그인 성공. 로그인 상태는 쿠키로 전달한다
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
        '401':
          description: 로그인 실패. 모든 실패 사유에 같은 응답
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/password-reset/requests:
    post:
      tags: [F1]
      summary: 비밀번호 재설정 요청
      description: ACTIVE 고객 계정이면 재설정 토큰을 이메일로 보낸다. 계정 존재 여부·상태와 상관없이 응답이 같다.
      x-allowed-roles: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: 접수(본문 없음)
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password-reset/confirm:
    post:
      tags: [F1]
      summary: 비밀번호 재설정 확인
      description: 유효하고 쓰지 않은 토큰으로 비밀번호를 바꾸고 기존 로그인 상태를 끝낸다. 토큰 문제는 이유를 구분하지 않는다.
      x-allowed-roles: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204':
          description: 변경 완료(본문 없음)
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/logout:
    post:
      tags: [F1]
      summary: 로그아웃
      description: 요청 계정의 기존 로그인 상태를 모두 끝낸다.
      x-allowed-roles: [CUSTOMER, CONSULTANT, BILLING_OPERATOR, ADMIN]
      responses:
        '204': { description: 로그아웃 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/profile:
    get:
      tags: [F2]
      summary: 내 정보 조회
      description: 대상 고객은 로그인 계정의 customer_id다. 요청에 담긴 고객 식별자는 쓰지 않는다.
      x-allowed-roles: [CUSTOMER]
      responses:
        '200':
          description: 본인 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [F2]
      summary: 내 정보 수정
      description: phone, email, address만 바꾼다. 그 밖의 필드가 요청에 있으면 거부한다.
      x-allowed-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: 수정 후 본인 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/password:
    put:
      tags: [F2]
      summary: 비밀번호 변경
      description: |
        current_password가 저장된 비밀번호와 맞을 때만 바꾼다.
        변경 후 password_changed_at을 기록하고 그 계정의 기존 로그인 상태를 모두 끝낸다.
      x-allowed-roles: [CUSTOMER, CONSULTANT, BILLING_OPERATOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: 변경 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /consultant/customers:
    get:
      tags: [F2]
      summary: 배정 고객 목록
      description: 요청 상담원에게 배정된 고객만 담는다.
      x-allowed-roles: [CONSULTANT]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 배정 고객 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerListItem' }
                  page: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /consultant/customers/search:
    get:
      tags: [F2]
      summary: 배정 고객 검색
      description: 요청 상담원에게 배정된 고객 중 조건에 맞는 고객만 담는다. 이름은 글자, 전화번호는 숫자를 포함하는지로 찾는다. 감사 기록을 남긴다.
      x-allowed-roles: [CONSULTANT]
      parameters:
        - in: query
          name: name
          description: 이름에 들어 있는 글자. 비어 있으면 조건이 없는 것으로 본다
          schema: { type: string, maxLength: 50 }
        - in: query
          name: phone
          description: 전화번호에 들어 있는 숫자(하이픈은 무시한다). 비어 있으면 조건이 없는 것으로 보고, 숫자가 하나도 없으면 400이다
          schema: { type: string, maxLength: 20 }
        - in: query
          name: sort
          description: 정렬 필드와 방향. 아래 값만 허용한다
          schema:
            type: string
            enum: ['customer_id,asc', 'customer_id,desc', 'name,asc', 'name,desc', 'created_at,asc', 'created_at,desc']
            default: 'customer_id,asc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 검색된 배정 고객 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerListItem' }
                  page: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /consultant/customers/{customer_id}/profile:
    get:
      tags: [F2]
      summary: 배정 고객 상세 조회
      description: 대상 고객의 assigned_consultant_id가 요청 상담원일 때만 응답한다. 감사 기록을 남긴다.
      x-allowed-roles: [CONSULTANT]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: 배정 고객 정보(마스킹)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultantCustomerView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consultant/customers/{customer_id}/contact:
    patch:
      tags: [F2]
      summary: 배정 고객 연락처 수정
      description: 배정 고객일 때만 phone, email, address를 바꾼다. 감사 기록을 남긴다. 응답은 마스킹 형태다.
      x-allowed-roles: [CONSULTANT]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdate' }
      responses:
        '200':
          description: 수정 후 배정 고객 정보(마스킹)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultantCustomerView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/members:
    get:
      tags: [F3]
      summary: 회원 목록 조회
      x-allowed-roles: [ADMIN]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
        - in: query
          name: name
          description: 이름 부분 일치 검색어
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: sort
          description: 정렬 필드와 방향. 아래 값만 허용한다
          schema:
            type: string
            enum: ['created_at,asc', 'created_at,desc', 'name,asc', 'name,desc', 'status,asc', 'status,desc']
            default: 'created_at,desc'
      responses:
        '200':
          description: 회원 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MemberListItem' }
                  page: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exports/members:
    get:
      tags: [F3]
      summary: 회원 목록 내보내기(CSV)
      description: 조건에 맞는 회원을 CSV로 내려 준다(최대 1000건, DELETED 제외). phone·email은 마스킹된다. 서버는 임시 파일을 응답 뒤에 남기지 않는다.
      x-allowed-roles: [ADMIN]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: CSV 파일(첫 줄은 열 이름 account_id,role,customer_id,name,phone,email,status)
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/audit-events:
    get:
      tags: [F3]
      summary: 감사 기록 조회
      description: 행위자·동작·기간(양 끝 날짜 포함, 운영 정책 시간대 기준 날짜, 기본 KST)으로 감사 기록을 조회한다. 사유 등 자유 입력 값은 응답에 없다.
      x-allowed-roles: [ADMIN]
      parameters:
        - in: query
          name: actor_id
          schema: { type: string, maxLength: 36 }
        - in: query
          name: action
          schema: { type: string, maxLength: 40 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: sort
          schema:
            type: string
            enum: ['occurred_at,asc', 'occurred_at,desc', 'action,asc', 'action,desc', 'result,asc', 'result,desc']
            default: 'occurred_at,desc'
      responses:
        '200':
          description: 감사 기록 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEventItem' }
                  page: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/members/{account_id}:
    get:
      tags: [F3]
      summary: 회원 상세 조회
      description: 고객 계정 조회는 감사 기록을 남긴다. DELETED 계정은 G1·G2·G3을 담지 않는다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 회원 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [F3]
      summary: 회원 삭제
      description: |
        ACTIVE, LOCKED, SUSPENDED → DELETED. 고객 계정은 모든 Subscription이 TERMINATED일 때만.
        본인 계정은 삭제할 수 없다. 대상의 기존 로그인 상태는 다음 요청부터 효력을 잃는다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - in: query
          name: reason_code
          required: true
          schema:
            type: string
            enum: [CUSTOMER_REQUEST, ADMIN_DECISION]
      responses:
        '200':
          description: 삭제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/members/{account_id}/view:
    get:
      tags: [F3]
      summary: 회원 상세 화면
      description: |
        관리자용 회원 상세 HTML 화면. 표시 항목과 형태는 GET /admin/members/{account_id}와 같다.
        고객이 입력한 값은 입력한 글자 그대로 보이게 표시한다. 고객 계정 조회는 감사 기록을 남긴다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 회원 상세 화면
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/members/{account_id}/suspend:
    post:
      tags: [F3]
      summary: 회원 정지
      description: ACTIVE, LOCKED → SUSPENDED. 본인 계정 불가. 대상의 기존 로그인 상태는 다음 요청부터 효력을 잃는다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: 정지 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/members/bulk-suspend:
    post:
      tags: [F3]
      summary: 회원 일괄 정지
      description: 목록의 ACTIVE, LOCKED 계정만 SUSPENDED로 바꾼다. 목록에 본인이 있으면 전체 거부.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkSuspendRequest' }
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkSuspendResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/members/{account_id}/unsuspend:
    post:
      tags: [F3]
      summary: 회원 정지 해제
      description: SUSPENDED → ACTIVE만. 본인 계정 불가.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: 정지 해제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/members/{account_id}/unlock:
    post:
      tags: [F3]
      summary: 회원 잠금 해제
      description: LOCKED → ACTIVE만. failed_login_count를 0으로 한다. 본인 계정 불가.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: 잠금 해제 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/members/{account_id}/role:
    put:
      tags: [F3]
      summary: 역할 변경
      description: |
        직원 계정(customer_id 없음)만, DELETED가 아닐 때만 바꾼다. 본인 계정 불가.
        CONSULTANT에서 다른 역할로 바뀌면 그 상담원의 배정은 모두 해제된다.
        대상의 기존 로그인 상태는 다음 요청부터 바뀐 역할로 판단한다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason]
              properties:
                role:
                  type: string
                  enum: [CONSULTANT, BILLING_OPERATOR, ADMIN]
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 역할 변경 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/customers/{customer_id}/assigned-consultant:
    put:
      tags: [F3]
      summary: 상담원 배정
      description: |
        대상 상담원은 role=CONSULTANT, status=ACTIVE 계정만. 고객마다 최대 한 명.
        이전 상담원은 다음 요청부터 그 고객에 접근할 수 없다.
      x-allowed-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consultant_account_id]
              properties:
                consultant_account_id:
                  type: string
                  nullable: true
                  description: null이면 배정 해제
      responses:
        '200':
          description: 배정 변경 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id: { $ref: '#/components/schemas/CustomerIdValue' }
                  assigned_consultant_id: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /consultant/response-templates:
    get:
      tags: [F9]
      summary: 문구 템플릿 조회
      description: 문구 템플릿 폴더에 있는 해당 이름의 텍스트 파일 내용을 돌려준다.
      x-allowed-roles: [CONSULTANT]
      parameters:
        - in: query
          name: name
          required: true
          description: 템플릿 파일 이름(예 greeting.txt)
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 템플릿 내용
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/members/lookup:
    get:
      tags: [F9]
      summary: 계정 아이디 검색
      description: 로그인 아이디가 입력한 글자로 시작하는 계정을 최대 100건 돌려준다. DELETED 계정은 제외한다.
      x-allowed-roles: [ADMIN]
      parameters:
        - in: query
          name: login_id_prefix
          required: true
          schema: { type: string, minLength: 1, maxLength: 30 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [login_id, created_at, status]
            default: login_id
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id: { type: string }
                        role: { $ref: '#/components/schemas/Role' }
                        customer_id:
                          allOf: [{ $ref: '#/components/schemas/CustomerIdValue' }]
                          nullable: true
                        name: { type: string, nullable: true }
                        status: { $ref: '#/components/schemas/AccountStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/agency/connectivity-check:
    post:
      tags: [F9]
      summary: 본인 확인 기관 연결 점검
      description: 서버 설정에 등록된 기관 주소에 요청을 보내 응답이 오는지 확인한다. 등록된 기관 주소가 아니면 400.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, maxLength: 300 }
      responses:
        '200':
          description: 점검 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  reachable: { type: boolean }
                  status: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/customers/bulk-assignments:
    post:
      tags: [F9]
      summary: 상담원 일괄 배정
      description: |
        요청 본문은 XML이다. assignments 아래 assignment 1~100개이고 각 assignment는 customer_id, consultant_id 요소를 가진다.
        항목마다 상담원 배정(F3 4.8)과 같은 규칙으로 처리하고 항목별 결과를 돌려준다.
      x-allowed-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: 항목별 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_id: { type: integer, nullable: true }
                        consultant_id: { type: string, nullable: true }
                        ok: { type: boolean }
                        error: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    loginSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: 서버가 로그인 시 발급한 로그인 상태 참조값

  parameters:
    AccountId:
      in: path
      name: account_id
      required: true
      schema: { type: string }
    CustomerId:
      in: path
      name: customer_id
      required: true
      schema: { $ref: '#/components/schemas/CustomerIdValue' }
    VerificationId:
      in: path
      name: verification_id
      required: true
      schema: { type: string }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    Size:
      in: query
      name: size
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 입력 형식 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 로그인 필요
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 역할상 허용되지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없거나 접근 범위 밖. 둘을 구분하지 않는다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 현재 상태에서 허용되지 않는 전이
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [CUSTOMER, CONSULTANT, BILLING_OPERATOR, ADMIN]
    AccountStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, LOCKED, SUSPENDED, DELETED]
    CustomerIdValue:
      type: integer
      format: int64
      minimum: 1
      description: 고객 식별자. 서버가 발급하는 양의 정수
    MaskedString:
      type: string
      description: data-model.md 2장의 마스킹 형태
    Error:
      type: object
      description: G1·G2·G3 원문과 다른 회원 정보를 담지 않는다
      properties:
        code: { type: string }
        message: { type: string }

    SignupRequest:
      type: object
      description: 아래 필드만 받는다. 정의되지 않은 필드(role, status, 식별자, 내부 정보 등)가 있으면 400
      additionalProperties: false
      required: [login_id, password, name, birth_date, phone, email, address]
      properties:
        login_id: { type: string, minLength: 4, maxLength: 30 }
        password: { type: string, format: password }
        name: { type: string, maxLength: 50 }
        birth_date: { type: string, format: date }
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email, maxLength: 100 }
        address: { type: string, maxLength: 200 }
    SignupResponse:
      type: object
      properties:
        signup_ref:
          type: string
          description: 가입 신청 참조값(서버 발급)
        status: { type: string, enum: [PENDING_VERIFICATION] }

    ContactUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email, maxLength: 100 }
        address: { type: string, maxLength: 200 }

    MyProfile:
      type: object
      description: 본인(CUSTOMER) 응답. G5, assigned_consultant_id, password_hash, ci는 담지 않는다
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerIdValue' }
        login_id: { type: string }
        name: { type: string }
        birth_date: { type: string, format: date }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        updated_at: { type: string, format: date-time }

    CustomerListItem:
      type: object
      description: 상담원 배정 고객 목록 항목
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerIdValue' }
        name: { $ref: '#/components/schemas/MaskedString' }
        phone: { $ref: '#/components/schemas/MaskedString' }
        status: { $ref: '#/components/schemas/AccountStatus' }

    ConsultantCustomerView:
      type: object
      description: 상담원(배정 고객) 응답. ci는 담지 않는다
      properties:
        customer_id: { $ref: '#/components/schemas/CustomerIdValue' }
        name: { $ref: '#/components/schemas/MaskedString' }
        birth_date: { $ref: '#/components/schemas/MaskedString' }
        phone: { $ref: '#/components/schemas/MaskedString' }
        email: { $ref: '#/components/schemas/MaskedString' }
        address: { $ref: '#/components/schemas/MaskedString' }
        credit_status: { type: string }
        collection_status:
          type: string
          enum: [NORMAL, OVERDUE, COLLECTION]
        status: { $ref: '#/components/schemas/AccountStatus' }

    MemberListItem:
      type: object
      description: 직원 계정은 name에 staff_name을 담고 customer_id, phone은 비어 있다
      properties:
        account_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        customer_id:
          allOf: [{ $ref: '#/components/schemas/CustomerIdValue' }]
          nullable: true
        name: { type: string, nullable: true }
        phone:
          allOf: [{ $ref: '#/components/schemas/MaskedString' }]
          nullable: true
        status: { $ref: '#/components/schemas/AccountStatus' }

    MemberDetail:
      type: object
      description: 관리자 응답. password_hash와 ci는 담지 않는다. DELETED 계정은 customer의 G1·G2·G3을 담지 않는다
      properties:
        account_id: { type: string }
        login_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        failed_login_count: { type: integer }
        identity_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        staff_name:
          type: string
          nullable: true
          description: 직원 계정일 때만
        customer:
          type: object
          nullable: true
          description: 고객 계정일 때만
          properties:
            customer_id: { $ref: '#/components/schemas/CustomerIdValue' }
            name: { type: string }
            birth_date: { $ref: '#/components/schemas/MaskedString' }
            phone: { $ref: '#/components/schemas/MaskedString' }
            email: { $ref: '#/components/schemas/MaskedString' }
            address: { $ref: '#/components/schemas/MaskedString' }
            credit_status: { type: string }
            collection_status:
              type: string
              enum: [NORMAL, OVERDUE, COLLECTION]
            assigned_consultant_id: { type: string, nullable: true }
            created_at: { type: string, format: date-time }

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    AuditEventItem:
      type: object
      additionalProperties: false
      properties:
        event_id: { type: integer }
        actor_id: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        customer_id: { type: integer, nullable: true }
        result: { type: string, enum: [SUCCESS, DENIED, FAILED] }
        occurred_at: { type: string, format: date-time }

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [login_id]
      properties:
        login_id: { type: string, minLength: 1, maxLength: 30 }

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    BulkSuspendRequest:
      type: object
      additionalProperties: false
      required: [account_ids, reason]
      properties:
        account_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }

    BulkSuspendResult:
      type: object
      properties:
        suspended: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: string } }

    StatusChangeResult:
      type: object
      properties:
        account_id: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
