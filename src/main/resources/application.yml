spring:
  application:
    name: customer-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${APP_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

app:
  login:
    lock-threshold: 5
  identity:
    verification-ttl-minutes: 10
    agency:
      base-url: ${AGENCY_BASE_URL}
      client-key: ${AGENCY_CLIENT_KEY}
  password-reset:
    ttl-minutes: 30
    max-requests-per-hour: 5
    min-response-millis: 300
  export:
    dir: ${EXPORT_DIR:./export-tmp}
  template:
    dir: ${TEMPLATE_DIR:./response-templates}
  encryption:
    key: ${FIELD_ENCRYPTION_KEY}
